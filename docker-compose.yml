name: ${COMPOSE_PROJECT_NAME:-ecoactions-local}

services:
  mongo-db:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-ecoactions_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-ecoactions_password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-ecoactions}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./docker/mongodb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ecoactions-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ecoactions-api:
    image: ${APP_IMAGE:-ecoactions-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo-db:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-ecoactions_admin}:${MONGO_ROOT_PASSWORD:-ecoactions_password}@mongo-db:27017/${MONGO_DATABASE:-ecoactions}?authSource=admin
      MONGODB_AUTO_INDEX_CREATION: ${MONGODB_AUTO_INDEX_CREATION:-true}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin123}
      APP_USER_USERNAME: ${APP_USER_USERNAME:-user}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-user123}
    ports:
      - "${APP_PORT:-8080}:${SERVER_PORT:-8080}"
    networks:
      - ecoactions-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:$${SERVER_PORT:-8080}/api/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongo-data:

networks:
  ecoactions-network:
    driver: bridge
