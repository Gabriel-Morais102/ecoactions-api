spring.application.name=ecoactions-api
server.port=${SERVER_PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ecoactions}
spring.data.mongodb.auto-index-creation=${MONGODB_AUTO_INDEX_CREATION:true}

app.security.admin.username=${APP_ADMIN_USERNAME:admin}
app.security.admin.password=${APP_ADMIN_PASSWORD:admin123}
app.security.user.username=${APP_USER_USERNAME:user}
app.security.user.password=${APP_USER_PASSWORD:user123}
