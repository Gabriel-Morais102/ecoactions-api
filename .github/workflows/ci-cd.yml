name: CI/CD - EcoActions API

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'documentacao/**'
      - 'deploy/README.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ecoactions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Baixar o código-fonte
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar e executar os testes
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Salvar JAR e relatórios de testes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ github.run_number }}
          path: |
            target/*.jar
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  docker-image:
    name: Criar imagem Docker
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_IMAGE: ecoactions-api:${{ github.sha }}

    steps:
      - name: Baixar o código-fonte
        uses: actions/checkout@v5

      - name: Construir a imagem da aplicação
        run: docker build --tag "$APP_IMAGE" .

      - name: Conferir usuário não privilegiado da imagem
        run: test "$(docker image inspect --format '{{.Config.User}}' "$APP_IMAGE")" = "spring:spring"

      - name: Empacotar a imagem para os deploys
        run: docker save "$APP_IMAGE" --output ecoactions-api-image.tar

      - name: Publicar a imagem como artefato do pipeline
        uses: actions/upload-artifact@v6
        with:
          name: ecoactions-api-image
          path: ecoactions-api-image.tar
          compression-level: 6
          retention-days: 1

  deploy-staging:
    name: Deploy em staging
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: docker-image
    runs-on: [self-hosted, Windows, X64, ecoactions-deploy]
    timeout-minutes: 30
    environment: staging
    defaults:
      run:
        shell: pwsh
    env:
      APP_IMAGE: ecoactions-api:${{ github.sha }}

    steps:
      - name: Baixar os arquivos de infraestrutura
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Baixar a imagem gerada no pipeline
        uses: actions/download-artifact@v7
        with:
          name: ecoactions-api-image

      - name: Carregar a imagem Docker
        run: docker load --input ecoactions-api-image.tar

      - name: Implantar staging e validar consultas e CRUD
        run: ./scripts/deploy.ps1 -Environment staging -Image $env:APP_IMAGE

  deploy-production:
    name: Deploy em produção
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - docker-image
      - deploy-staging
    runs-on: [self-hosted, Windows, X64, ecoactions-deploy]
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        shell: pwsh
    env:
      APP_IMAGE: ecoactions-api:${{ github.sha }}

    steps:
      - name: Baixar os arquivos de infraestrutura
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verificar a imagem aprovada no Docker local
        id: local_image
        run: |
          docker image inspect $env:APP_IMAGE *> $null
          $available = $LASTEXITCODE -eq 0
          "available=$($available.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0

      - name: Baixar a imagem aprovada em staging
        if: steps.local_image.outputs.available != 'true'
        uses: actions/download-artifact@v7
        with:
          name: ecoactions-api-image

      - name: Carregar a imagem Docker
        if: steps.local_image.outputs.available != 'true'
        run: docker load --input ecoactions-api-image.tar

      - name: Implantar produção e validar consultas
        run: ./scripts/deploy.ps1 -Environment production -Image $env:APP_IMAGE
